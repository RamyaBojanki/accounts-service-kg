          afterResponse: >-
            // Extract account_id from the response and store it in the
            environment

            let data = insomnia.response.json();

            insomnia.environment.set("accountId", data.account_id);


            console.log(`Response status: ${insomnia.response.code}`);if
            (insomnia.response.code !== 201) {console.log("Warning: Unexpected
            status code");}
        settings:
